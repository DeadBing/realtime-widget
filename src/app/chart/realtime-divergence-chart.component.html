<div class="realtime-chart">
  <div
    class="realtime-chart__status"
    *ngIf="!connected && !loading && !error && active"
  >
    Connecting to market data...
  </div>
  <div class="realtime-chart__status" *ngIf="loading && active">
    Loading chart...
  </div>
  <div class="realtime-chart__status realtime-chart__status--error" *ngIf="error">
    {{ error }}
  </div>

  <div #chartContainer class="realtime-chart__canvas"></div>
</div>
